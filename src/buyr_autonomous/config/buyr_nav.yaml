amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    laser_model_type: "likelihood_field"
    laser_max_range: 5.5
    laser_min_range: 0.05
    max_beams: 60
    z_hit: 0.5
    z_rand: 0.5
    sigma_hit: 0.2
    update_min_d: 0.2
    update_min_a: 0.2
    transform_tolerance: 1.0

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # --- 속도 제한 수정 ---
      min_vel_x: 0.0
      max_vel_x: 0.17      # 기존 0.22 -> 0.17 (요청 사항)
      max_vel_theta: 0.5   # 기존 1.0 -> 0.5 (요청 사항)
      
      # --- 가속도 조정 (실제 로봇 안정성) ---
      acc_lim_x: 1.5       # 기존 2.5는 실제 로봇에게 급발진일 수 있어 낮춤
      acc_lim_theta: 1.5   # 기존 3.2에서 낮춰 부드러운 회전 유도
      decel_lim_x: -1.5
      decel_lim_theta: -1.5
      
      # --- 샘플링 및 예측 ---
      vx_samples: 20
      vtheta_samples: 20
      sim_time: 1.5        # 속도가 느려졌으므로 예측 시간도 살짝 줄여 반응성 확보
      
      # --- 정밀도 관련 ---
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      
      # --- 가중치(Critics) ---
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.5    # 중요! 시뮬레이션용 0.02는 위험함. 장애물 회피 가중치 대폭 상향
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_frame: odom
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"

# 에러 방지를 위한 추가 설정
map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/taemin/buyr_map.yaml" # 경로 직접 입력
