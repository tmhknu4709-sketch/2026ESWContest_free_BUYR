ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 10.0
    two_d_mode: true
    publish_tf: true  # EKF가 odom -> base_footprint 변환을 발행합니다.

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom # 로컬 보정만 담당하므로 odom으로 설정

    # 1. 바퀴 엔코더 (거리 및 속도)
    odom0: odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_relative: false

    # 2. IMU (회전 각속도 및 가속도)
    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,  # Yaw (상대적)
                  false, false, false,
                  false, false, true,  # Yaw Velocity (핵심)
                  false, false, false] # 실전에서는 가속도(Linear Accel)는 노이즈가 심해 끄는 것이 안정적입니다.
    imu0_relative: true

